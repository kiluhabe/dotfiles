# mise — language runtimes, language servers & CLI tools
#
# Local: `mise install` (everything)
# Pod:   `mise install ruby node npm:typescript-language-server gem:ruby-lsp`
#        (declared-but-uninstalled tools are harmless; shims just error if invoked)
#
# All artifacts live under $HOME (no sudo, persists with home volume).

[tools]
# Languages
ruby      = "4.0"
python    = "3.14"
node      = "24"           # Active LTS
go        = "1.26"
terraform = "1.14"
java      = "temurin-25"   # LTS
rust      = "stable"
deno      = "latest"
ghc       = "9.14"         # Haskell compiler (via mise-ghcup plugin)
cabal     = "3.16"

# Language servers (prebuilt binaries preferred — pod-friendly)
"npm:typescript-language-server"         = "latest"
"gem:ruby-lsp"                           = "latest"
"github:rust-lang/rust-analyzer"         = "latest"
"go:golang.org/x/tools/gopls"            = "latest"
"aqua:hashicorp/terraform-ls"            = "latest"
"github:haskell/haskell-language-server" = "latest"

# CLI tools (prebuilt binaries; GUI apps and system tools stay in Brewfile)
fzf                       = "latest"
jq                        = "latest"
delta                     = "latest"
"aqua:neovim/neovim"      = "latest"   # the short name resolves to a vfox plugin
stern                     = "latest"
direnv                    = "latest"
ripgrep                   = "latest"
shellcheck                = "latest"
gitleaks                  = "latest"
uv                        = "latest"
aws-cli                   = "latest"
kubectl                   = "latest"
hunk                      = "latest"
"github:googleworkspace/cli"  = "latest"   # gws
"pipx:podman-compose"     = "latest"
eza                       = "latest"   # `eza --tree` replaces tree
codex                     = "latest"
claude                    = "latest"   # self-update disabled in claude settings.json; update with `mise up`

[settings]
# Use prebuilt distributions instead of source builds (avoids apt build deps;
# matches the upcoming default for ruby in 2026)
python.compile = false
ruby.compile   = false
# Quiet status messages on directory enter
status.show_tools = false
status.show_env   = false
# ghc is registered with conda as default backend; conda init leaks
# `get_or_create_subdir` debug prints on every mise invocation. Disable
# conda so ghc falls back to asdf:mise-plugins/mise-ghcup (intended backend).
disable_backends = ["conda"]
