set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB"
source-file ~/.config/theme/current/tmux.conf

set -g default-shell /bin/bash
set -g default-command "/bin/bash --login"

unbind -n C-b
bind-key -n C-b run-shell -b "ime-ascii" \; switch-client -T prefix

# Nested tmux (e.g. remote container session): F12 disables this outer
# tmux's prefix key and status bar so keys and the status line pass
# through to the inner tmux untouched. F12 again restores both.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status off \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set status on \;\
  refresh-client -S

set -g escape-time 0
set -g allow-rename off
set -g automatic-rename off
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=red#,bold] ● ,}"
set -g pane-border-lines single
set -g pane-border-style "fg=#{@color8}"
set -g pane-active-border-style "fg=#{@color4}"
set-hook -g window-layout-changed "set -Fw pane-border-status '#{?#{==:#{window_panes},1},off,top}'"

set -g status-justify left
set -g status-style "fg=#{@foreground},bg=#{@color8}"
set -g status-right-length 50
set -g status-left-length 60
set -g status-interval 1
set -g status-left  '#{b:pane_current_path} | #[fg=blue,bold]#(cd #{pane_current_path}; tmux_branchname) #[default]|'
set -g status-right '#(ime-status)#(date "+%H:%M") | #H'
set-window-option -g window-status-format " #W  |"
set-window-option -g window-status-current-format "#[fg=red,bold] ● #W #[default] |"


set -g base-index 1
setw -g pane-base-index 1

set-option -g mouse on
unbind -n MouseDrag1Pane
unbind -Tcopy-mode MouseDrag1Pane

bind r source-file ~/.tmux.conf \; display "😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺 😺"
bind c new-window -c "#{pane_current_path}"
bind % split-window -hc "#{pane_current_path}"
bind '"' split-window -vc "#{pane_current_path}"
bind a run-shell "tmux-goto watch"
bind e run-shell "tmux-goto editor"
bind g run-shell "tmux-goto agent"
bind h run-shell "tmux-goto shell"
bind-key -T copy-mode C-c send-keys -X copy-pipe "tmux save-buffer - | clip" \; display-message "copied to system clipboard" \; send-keys -X

bind Space display-menu -T "#[align=centre] tmux " -x C -y C -- \
  "-Pane-"            ""  "" \
  "Split horizontal"  "%" "split-window -hc '#{pane_current_path}'" \
  "Split vertical"    '"' "split-window -vc '#{pane_current_path}'" \
  "Zoom toggle"       "z" "resize-pane -Z" \
  "Kill pane"         "x" "kill-pane" \
  "" \
  "-Window-"          ""  "" \
  "New window"        "c" "new-window -c '#{pane_current_path}'" \
  "Rename window"     "," "command-prompt -I '#W' 'rename-window %%'" \
  "" \
  "-Session-"         ""  "" \
  "Detach"            "d" "detach-client" \
  "Choose session"    "s" "choose-tree -Zs" \
  "Reload config"     "r" "source-file ~/.tmux.conf"

set-window-option -g mode-keys emacs