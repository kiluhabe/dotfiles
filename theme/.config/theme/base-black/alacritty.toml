[colors.primary]
background = "#1C1C1C" # bg
foreground = "#E8E5DE" # fg

[colors.cursor]
cursor = "#DD4B29" # accent

[colors.normal]
black   = "#1C1C1C" # bg
red     = "#C0282C" # error
green   = "#016937" # success
yellow  = "#FAB513" # warning
blue    = "#0070BA" # accent2
magenta = "#C0282C" # error (nearest hue; palette has no magenta)
cyan    = "#0070BA" # accent2 (nearest hue; palette has no cyan)
white   = "#858E8E" # border

[colors.bright]
black   = "#A9875A" # border2
red     = "#C0282C" # error
green   = "#016937" # success
yellow  = "#FAB513" # warning
blue    = "#0070BA" # accent2
magenta = "#C0282C" # error
cyan    = "#0070BA" # accent2
white   = "#E8E5DE" # fg
